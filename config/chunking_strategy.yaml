# How policy documents are split into chunks for retrieval.
# Each policy is split at its own section headings (semantic chunking),
# not at a fixed character count. A section longer than max_words is
# split further into overlapping windows so it fits the embedding model.
#
# sections:       headings to split at AND index for search
# skip_sections:  headings that end the previous section but are NOT indexed
#                 (code lists and version history add noise to search)

defaults:
  max_words: 180      # all-MiniLM-L6-v2 truncates input around 256 tokens
  overlap_words: 30

# Shared layout for every Sample Commercial Health Plan policy.
# Change it here once and every commercial policy follows.
commercial_layout: &commercial_sections
  - "Precertification Requirements"
  - "Medical Necessity Criteria"
  - "Not Medically Necessary"
  - "Experimental, Investigational, or Unproven"
  - "Documentation Requirements"
  - "Background"
commercial_skip: &commercial_skip
  - "Codes"
  - "Policy History"

policies:
  # ---------------- Medicare (LCD-style layout) ----------------
  - policy_id: medicare_lcd_lumbar_mri
    file: data/raw/policies/medicare_lcd_lumbar_mri_SYNTHETIC.txt
    payer: Medicare
    jurisdiction: JK  # example region; each MAC jurisdiction can have its own LCD
    document_type: LCD
    procedure_codes: ["72148"]
    synthetic: true   # set to false after replacing with a real downloaded LCD
    sections:
      - "Coverage Indications, Limitations, and/or Medical Necessity"
      - "Red Flag Conditions"
      - "Limitations"
      - "Documentation Requirements"

  # ------- Sample Commercial Health Plan (fictional payer, CPB-style layout) -------
  - policy_id: commercial_lumbar_mri
    file: data/raw/policies/commercial_payer_lumbar_mri_SYNTHETIC.txt
    payer: SampleCommercial
    jurisdiction: national
    document_type: Commercial clinical policy bulletin
    procedure_codes: ["72148"]
    synthetic: true
    sections: *commercial_sections
    skip_sections: *commercial_skip

  - policy_id: commercial_cervical_mri
